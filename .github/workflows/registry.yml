name: skill registry
# Builds the public site (product homepage, edition downloads, skill registry) and deploys it to
# Cloudflare Pages at https://aios-registry-47b.pages.dev/, the default for `aios skills search/install`.
# Pull requests build it and install every skill from the built site, without deploying.
on:
  push:
    branches: [main]
    paths: ["registry/**", "aios*.py", "scripts/build-*.py", "web/**", "editions/**", "docs/**", "examples/**", "pyproject.toml", "requirements.txt", "policy.example.toml", "demo_mcp_server.py", "README*", "LICENSE", ".github/workflows/registry.yml"]
  pull_request:
    paths: ["registry/**", "aios*.py", "scripts/build-*.py", "web/**", "editions/**", "docs/**", "examples/**", "pyproject.toml", "requirements.txt", "policy.example.toml", "demo_mcp_server.py", "README*", "LICENSE", ".github/workflows/registry.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # the pages.dev name Cloudflare gave project aios-registry ("aios-registry" itself belongs to someone else)
  SITE_URL: https://aios-registry-47b.pages.dev/

concurrency:
  group: skill-registry-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site on top of what is already published
        shell: bash
        env:
          # optional: an SSH private key; when set, every skill is signed with it
          SIGNING_KEY: ${{ secrets.AIOS_REGISTRY_SIGNING_KEY }}
        run: |
          args=()
          if [ -n "$SIGNING_KEY" ]; then
            (umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing_key")
            args=(--key "$RUNNER_TEMP/signing_key")
          fi
          python scripts/build-registry.py registry _site --live "$SITE_URL" --url "$SITE_URL" "${args[@]}"
          rm -f "$RUNNER_TEMP/signing_key"
      - name: Build product homepage and direct edition downloads
        run: |
          mv _site/index.html _site/skills.html
          python scripts/build-products.py _site
          python -m unittest discover -s tests -p 'test_products.py' -v
      - name: Search and install every skill from the built site, as a user would
        shell: bash
        run: |
          (cd _site && python -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &)
          until curl -fsS http://127.0.0.1:8000/index.json > /dev/null; do sleep 0.2; done
          python aios.py skills search --registry http://127.0.0.1:8000
          home=$(mktemp -d)
          for name in $(python -c "import json; print(' '.join(sorted({e['name'] for e in json.load(open('_site/index.json'))['skills']})))"); do
            python aios.py skills install "$name" --registry http://127.0.0.1:8000 --home "$home" --yes
          done
          python aios.py skills list --home "$home"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: _site

  # Cloudflare Pages (free plan). Needs the CLOUDFLARE_API_TOKEN ("Account > Cloudflare Pages > Edit")
  # and CLOUDFLARE_ACCOUNT_ID secrets.
  cloudflare:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: aios-registry
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Deploy to Cloudflare Pages
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required"; exit 1
          fi
          test -f "$RUNNER_TEMP/site/index.json"
          # Explain a rejected token before wrangler's bare "Authentication error"
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          api user/tokens/verify | jq -e '.success' > /dev/null \
            || { echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN itself (wrong, expired or revoked token)"; exit 1; }
          accounts=$(api accounts)
          echo "Accounts this token can use: $(echo "$accounts" | jq -r '[.result[].name] | join(", ")')"
          echo "$accounts" | jq -e '.result | length > 0' > /dev/null \
            || { echo "::error::the token reaches no Cloudflare account: set its Account Resources to Include your account, with Account > Cloudflare Pages > Edit (the \"Edit Cloudflare Workers\" template works)"; exit 1; }
          echo "$accounts" | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result | any(.id == $id)' > /dev/null \
            || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not one of the accounts this token can use (the 32-character ID after dash.cloudflare.com/, not a Zone ID); or the token's Account Resources leave that account out"; exit 1; }
          npx --yes wrangler@3 pages project list > "$RUNNER_TEMP/projects.txt" \
            || { echo "::error::the token cannot read Cloudflare Pages: give it Account > Cloudflare Pages > Edit"; exit 1; }
          grep -qw "$PROJECT" "$RUNNER_TEMP/projects.txt" \
            || npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main
          npx --yes wrangler@3 pages deploy "$RUNNER_TEMP/site" --project-name "$PROJECT" --branch main --commit-dirty=true \
            | tee "$RUNNER_TEMP/deploy.txt"
          # pages.dev names are global: a taken name gets a suffix, and the default registry must be ours
          host=${SITE_URL#https://}; host=${host%/}
          grep -q "\.$host" "$RUNNER_TEMP/deploy.txt" \
            || { echo "::error::deployed somewhere other than $SITE_URL: update SITE_URL and aios_skills.PUBLIC_REGISTRY"; exit 1; }
