name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Prepare the Docker sandbox tests (Linux runners only)
        if: runner.os == 'Linux'
        run: |
          docker pull python:3.12-slim
          docker version
          docker info --format 'CgroupVersion={{.CgroupVersion}} CgroupDriver={{.CgroupDriver}} SecurityOptions={{json .SecurityOptions}}'
          docker image inspect --format '{{json .RepoDigests}}' python:3.12-slim
          echo "AIOS_TEST_DOCKER=1" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
