# aios-core policy example.
#   python aios.py chat --agent notes --policy policy.example.toml     (needs Python 3.11+)
# Tools not listed under `permissions` are invisible to the agent.

[agents.notes]
permissions = ["now", "read_file", "write_file", "list_files", "remember", "recall"]

# write_file: only inside workspace/notes/. Writes there need no [y/N] prompt,
# unless the run has read untrusted content (then a person is always asked).
[agents.notes.scopes.write_file]
paths = ["notes/*"]
auto_paths = ["notes/*"]
max_calls = 20          # per run

# read_file: any path inside the workspace (shown for the syntax; '*' matches everything).
[agents.notes.scopes.read_file]
paths = ["*"]

# ---------------------------------------------------------------------------------
# For MCP server mode:  python aios.py serve --agent gateway --policy policy.example.toml
# Over stdio nobody can answer a [y/N] prompt, so risky tools are refused unless a
# path is pre-allowed with auto_paths (and only while the session has read nothing untrusted).
[agents.gateway]
permissions = ["now", "read_file", "list_files", "write_file"]

[agents.gateway.scopes.write_file]
paths = ["out/*"]
auto_paths = ["out/*"]
max_calls = 50          # per server session

# ---------------------------------------------------------------------------------
# For scheduled jobs:  python aios.py jobs add digest "Summarise inbox.txt into reports/" \
#                          --schedule "daily 09:00" --agent reporter
#                      python aios.py daemon --policy policy.example.toml --provider openai --model llama3.1
# Jobs run unattended, so nobody can answer a [y/N] prompt: risky tools are refused unless a path
# is pre-allowed here. A job that READS a file is "tainted"; auto_when_tainted = true says you accept
# that injected text in what it read could write (only) into reports/. Without it, such a job can
# read and report but not write.
[agents.reporter]
permissions = ["now", "read_file", "list_files", "write_file"]

[agents.reporter.scopes.write_file]
paths = ["reports/*"]
auto_paths = ["reports/*"]
auto_when_tainted = true
max_calls = 5           # per run

# ---------------------------------------------------------------------------------
# Several agents working together:  python aios.py chat --agent lead --policy policy.example.toml
# Every agent in this file can be handed a sub-task through a tool named agent__<name>. Grant it like
# any tool. The helper works with ITS OWN permissions, scopes and memory, starts each sub-task fresh,
# and inherits the caller's taint: if `lead` has read an untrusted file, `notes` gets no auto_paths.
[agents.lead]
permissions = ["now", "read_file", "list_files", "agent__notes"]

# Argument rules: limit the VALUES a tool may be called with, here the built-in fetch_url (the same
# works for MCP tools, which have no workspace path, e.g. "web__fetch").
# Start with: python aios.py chat --agent researcher --policy policy.example.toml
[agents.researcher]
permissions = ["now", "fetch_url"]

[agents.researcher.scopes.fetch_url]
max_calls = 10
# No [y/N] prompt for these URLs (clean runs only, like auto_paths). Write host/* rather than
# host*: '*' matches anything, so "https://docs.python.org*" would also match docs.python.org.evil.com
auto_args = { url = ["https://docs.python.org/*"] }

# fetch_url refuses local and private addresses and does not follow redirects by itself; these
# rules matter most for MCP fetch tools, which may do neither
[agents.researcher.scopes.fetch_url.args.url]
allow = ["https://*"]                                       # case-sensitive; an allowed argument must be given
deny = ["*localhost*", "*127.0.0.1*", "*169.254.169.254*"]  # ignores case
max_len = 2000

# ---------------------------------------------------------------------------------
# Agent swarm: many helpers at once.  python aios.py chat --agent swarm_lead --policy policy.example.toml
# The `swarm` tool reaches only helpers this agent may call one by one (agent__worker, agent__editor);
# each task gets the same permission, scope, approval, taint and audit as a single delegation.
# Batch mode, no lead model:  python aios.py swarm --policy policy.example.toml --agent worker \
#                                 --tasks tasks.txt --out results.jsonl --parallel 64 --reduce editor
[agents.swarm_lead]
permissions = ["now", "list_files", "swarm", "agent__worker", "agent__editor"]

[agents.swarm_lead.scopes.agent__worker]
max_calls = 500         # per run: every swarm task counts

[agents.worker]         # read-only: safe to run hundreds at once without approvals
permissions = ["now", "read_file", "list_files"]

[agents.editor]         # combines the workers' answers; it reads only what they returned
permissions = []
