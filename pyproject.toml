[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-core"
version = "0.1.0"
description = "Secure-by-default, local-first runtime for AI agents: scheduler, permissions, memory, sandboxed tools and MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # standard library only; providers and MCP are extras

[project.optional-dependencies]
anthropic = ["anthropic"]
mcp = ["mcp"]
all = ["anthropic", "mcp"]

[project.scripts]
aios = "aios:cli"

[project.urls]
Homepage = "https://github.com/tonythetiger168/aios-core"

[tool.setuptools]
# every aios*.py module; tests/test_packaging.py fails when a new one is missing here
py-modules = ["aios", "aios_a2a", "aios_appcontainer", "aios_auditout", "aios_checkpoint", "aios_console",
              "aios_egress", "aios_fetch", "aios_keeper", "aios_memory", "aios_microvm_init", "aios_schedule",
              "aios_service", "aios_skills", "aios_swarm", "aios_telegram", "aios_watchdog"]
