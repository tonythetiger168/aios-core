[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-os"  # "aios-core" on PyPI belongs to another project (agiresearch/AIOS)
version = "0.2.0"
description = "Secure-by-default, local-first runtime for AI agents: scheduler, permissions, memory, sandboxed tools and MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # standard library only; providers and MCP are extras

[project.optional-dependencies]
anthropic = ["anthropic"]
mcp = ["mcp"]
all = ["anthropic", "mcp"]

[project.scripts]
aios = "aios:cli"

[project.urls]
Homepage = "https://aios-registry-47b.pages.dev/"
Source = "https://github.com/tonythetiger168/aios-core"
Changelog = "https://github.com/tonythetiger168/aios-core/blob/main/CHANGELOG.md"

[tool.setuptools]
# every aios*.py module; tests/test_packaging.py fails when a new one is missing here
py-modules = ["aios", "aios_a2a", "aios_admit", "aios_appcontainer", "aios_auditout", "aios_bot", "aios_checkpoint", "aios_compact",
              "aios_console", "aios_egress", "aios_export", "aios_fetch", "aios_improve", "aios_keeper", "aios_media", "aios_memory", "aios_office",
              "aios_microvm_init", "aios_node", "aios_schedule", "aios_service", "aios_skills", "aios_supervisor", "aios_swarm",
              "aios_telegram", "aios_watchdog"]
